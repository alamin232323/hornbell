if(V==='me')return'<h1 class="h1">'+t('me')+'</h1><div class="g"><div class="t2" style="font-size:13px">'+t('lang')+'</div><div class="scroll"><button class="chip'+(S.lang==='bn'?' on':'')+'" data-a="setlang" data-v="bn">বাংলা</button><button class="chip'+(S.lang==='en'?' on':'')+'" data-a="setlang" data-v="en">English</button></div><div class="t2" style="font-size:13px">'+t('cur')+'</div><div class="scroll">'+['৳','$','₹'].map(c=>'<button class="chip'+(S.cur===c?' on':'')+'" data-a="setcur" data-v="'+c+'">'+c+'</button>').join('')+'</div><div class="row"><span>'+t('lite')+'</span><button class="chip'+(S.lite?' on':'')+'" role="switch" aria-checked="'+S.lite+'" data-a="lite">'+(S.lite?'ON':'OFF')+'</button></div></div><p class="t2" style="font-size:13px">'+t('loc')+'</p><button class="btn s" data-a="reset">'+(RS?t('sure'):t('reset'))+'</button>'+nav();return''}
function sheet(){if(!SH)return'';const b=bike();let h='';
if(SH.t==='fuel'){const l=fl(b).sort((a,c)=>c.o-a.o)[0];h=field('fo',t('odo'),Math.round(odoOf(b)))+field('fl',t('lit'),'','5.5')+field('fp',t('ppl'),l?l.p:'')+'<label class="row" style="margin:14px 0"><span>'+t('full')+'</span><input id="ff" type="checkbox" checked style="width:28px;height:28px"></label>'}
if(SH.t==='svc')h='<label for="sk">'+t('type')+'</label><select id="sk">'+SV.map(s=>'<option value="'+s.k+'">'+t(s.k)+'</option>').join('')+'</select>'+field('so',t('odo'),Math.round(odoOf(b)))+field('sc',t('cost'),'');
if(SH.t==='bike'){const c=CAT[SH.i];h='<h2 style="margin:0">'+c[0]+' '+c[1]+'</h2><label for="by">'+t('yr')+'</label><select id="by">'+Array.from({length:15},(_,i)=>2026-i).map(y=>'<option'+(y===2024?' selected':'')+'>'+y+'</option>').join('')+'</select>'+field('bo',t('odo'),'')}
return'<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true">'+h+'<div class="err" id="er">'+(ER?'⚠ '+ER:'')+'</div><div class="grid" style="margin-top:14px"><button class="btn s" data-a="close">'+t('cancel')+'</button><button class="btn" data-a="ok">'+t('save')+'</button></div></div>'}
function R(){document.body.className=(S.lang==='bn'?'bn ':'')+(S.lite?'lite':'');document.documentElement.lang=S.lang;$('#app').innerHTML=view()+sheet();window.scrollTo(0,0)}
const $=s=>document.querySelector(s),num=id=>{const v=parseFloat(($('#'+id)||{}).value);return isFinite(v)&&v>=0?v:NaN};
function go(v){if(v!=='pick'&&!S.bikes.length&&v!=='welcome')v='pick';V=v;SH=null;ER='';R()}
const A={go:v=>go(v),lang:()=>{S.lang=S.lang==='bn'?'en':'bn';save();R()},setlang:v=>{S.lang=v;save();R()},setcur:v=>{S.cur=v;save();R()},lite:()=>{S.lite=!S.lite;save();R()},
brand:v=>{F=v;R()},model:v=>{SH={t:'bike',i:+v};ER='';R()},sh:v=>{SH={t:v};ER='';R()},close:()=>{SH=null;ER='';R()},act:v=>{S.active=+v;save();go('home')},
delf:v=>{S.fuel.splice(+v,1);save();R()},dels:v=>{S.svc.splice(+v,1);save();R()},reset:()=>{if(!RS){RS=true;R();return}S={...D,bikes:[],fuel:[],svc:[]};save();RS=false;V='welcome';R()},
ok:()=>{const b=bike();ER='';if(SH.t==='fuel'){const o=num('fo'),l=num('fl'),p=num('fp');if(!(o>0&&l>0&&p>0)){ER=t('e1');return R2()}S.fuel.push({b:b.id,d:today(),o,l,p,f:$('#ff').checked})}
else if(SH.t==='svc'){const o=num('so'),c=num('sc');if(!(o>0)||isNaN(c)){ER=t('e1');return R2()}S.svc.push({b:b.id,d:today(),o,k:$('#sk').value,c})}
else{const o=num('bo'),c=CAT[SH.i];if(isNaN(o)||$('#bo').value===''){ER=t('e1');return R2()}S.bikes.push({id:Date.now(),name:c[0]+' '+c[1],cc:c[2],yr:+$('#by').value,odo:o});S.active=S.bikes.length-1;S.seen=true;V='home'}
SH=null;save();R()}};
function R2(){$('#er').textContent='⚠ '+ER}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;$('#cl').innerHTML=catList()}});
